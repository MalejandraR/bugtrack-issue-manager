# Render Blueprint — infrastructure as code.
# Creates the backend web service (Docker) + a free Postgres instance.
# Render has no native Java runtime; Docker is the official path for JVM apps.
services:
  - type: web
    name: bugtrack-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Wire the Postgres instance into the service (Render does NOT link it
      # automatically). application.yml composes these into a JDBC URL.
      - key: BUGTRACK_DB_HOST
        fromDatabase:
          name: bugtrack-db
          property: host
      - key: BUGTRACK_DB_PORT
        fromDatabase:
          name: bugtrack-db
          property: port
      - key: BUGTRACK_DB_USERNAME
        fromDatabase:
          name: bugtrack-db
          property: user
      - key: BUGTRACK_DB_PASSWORD
        fromDatabase:
          name: bugtrack-db
          property: password
      - key: BUGTRACK_DB_NAME
        fromDatabase:
          name: bugtrack-db
          property: database
      # Dashboard-managed (sync: false): a blueprint sync must NEVER overwrite
      # values edited by hand in the Render dashboard Environment tab.
      - key: CORS_ALLOWED_ORIGINS
        sync: false # = https://bugtrack-issue-manager.vercel.app
      # --- Fase 7: autenticación JWT ---
      # HS256 signing secret: Render generates ≥32 random bytes on first deploy
      # (regenerate from the Environment tab to invalidate all sessions).
      - key: AUTH_JWT_SECRET
        generateValue: true
      # Token lifetime in hours (optional; 24 is also the app default).
      - key: AUTH_JWT_EXPIRY_HOURS
        value: "24"
      # Admin account seeded ONLY when the users table is empty. Fill both in
      # the Render dashboard (Environment tab) before the first auth deploy:
      # left blank, the backend logs a WARN and no admin is created (login stays
      # unusable until you set them and restart, or seed manually).
      - key: AUTH_ADMIN_EMAIL
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false

databases:
  - name: bugtrack-db
    plan: free
    databaseName: bugtrack
    user: bugtrack
