# Render Blueprint — infrastructure as code.
# Creates the backend web service (Docker) + a free Postgres instance.
# Render has no native Java runtime; Docker is the official path for JVM apps.
services:
  - type: web
    name: bugtrack-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Wire the Postgres instance into the service (Render does NOT link it
      # automatically). application.yml composes these into a JDBC URL.
      - key: BUGTRACK_DB_HOST
        fromDatabase:
          name: bugtrack-db
          property: host
      - key: BUGTRACK_DB_PORT
        fromDatabase:
          name: bugtrack-db
          property: port
      - key: BUGTRACK_DB_USERNAME
        fromDatabase:
          name: bugtrack-db
          property: user
      - key: BUGTRACK_DB_PASSWORD
        fromDatabase:
          name: bugtrack-db
          property: password
      - key: BUGTRACK_DB_NAME
        fromDatabase:
          name: bugtrack-db
          property: database
      # Set after the Vercel frontend URL is known (e.g. https://bugtrack.vercel.app).
      # Editable later in the Render dashboard (Environment tab).
      - key: CORS_ALLOWED_ORIGINS
        value: ""

databases:
  - name: bugtrack-db
    plan: free
    databaseName: bugtrack
    user: bugtrack
