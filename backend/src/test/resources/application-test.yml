# Test profile — activated with @ActiveProfiles("test") on integration tests.
#
# WHY THE PASSWORD HAS A DEFAULT HERE (and ONLY here):
# `mvn test` must run without sourcing backend/.env, so a missing BUGTRACK_DB_PASSWORD
# must not break the build. The fallback points at the throwaway local database
# `bugtrack_test` (port 5436), which holds no real data and is recreated/cleaned by the
# test lifecycle. Every other profile (application.yml) keeps the password MANDATORY
# with no fallback, so the real database can never be reached with an implicit secret.
# To override: `BUGTRACK_DB_PASSWORD=... mvn test`.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5436/bugtrack_test
    username: bugtrack
    password: ${BUGTRACK_DB_PASSWORD:bugtrack-local-2026}

  jpa:
    hibernate:
      # Same contract as production: schema.sql owns the DDL, JPA only validates it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      # CREATE TABLE IF NOT EXISTS is idempotent, so re-running on every context start
      # is safe and guarantees a known schema for each test run.
      mode: always
      # Surefire runs with backend/ as the working directory, so the relative path
      # resolves to <repo>/database/schema.sql (same file the app uses).
      schema-locations: file:../database/schema.sql
