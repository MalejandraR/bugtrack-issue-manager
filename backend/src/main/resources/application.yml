spring:
  application:
    name: bugtrack-backend

  # Resolution chain for the datasource:
  #   1. BUGTRACK_DB_URL          — full JDBC URL (local .env, CI).
  #   2. JDBC_DATABASE_URL        — injected by some platforms (Heroku-style).
  #   3. BUGTRACK_DB_HOST/PORT/NAME — discrete Render Postgres vars wired via
  #      fromDatabase in render.yaml (Render provides no JDBC-form URL).
  # The password is NEVER defaulted here: it must come from the environment.
  datasource:
    url: ${BUGTRACK_DB_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${BUGTRACK_DB_HOST:127.0.0.1}:${BUGTRACK_DB_PORT:5436}/${BUGTRACK_DB_NAME:bugtrack}}}
    username: ${BUGTRACK_DB_USERNAME:bugtrack}
    password: ${BUGTRACK_DB_PASSWORD:}

  jpa:
    hibernate:
      # Schema is owned by database/schema.sql; JPA only validates the mapping.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always
      # Requires running the app from backend/ (relative path).
      # Render runs with rootDir=backend, so the same relative path resolves there;
      # the env var exists as a safety override for any other layout.
      schema-locations: ${BUGTRACK_SCHEMA_LOCATION:file:../database/schema.sql}

server:
  # Render/Heroku-style platforms inject their own port via $PORT.
  port: ${PORT:8080}
